<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>TurboKart — track layouts</title>
<style>
  html,body{margin:0;background:#14161c;color:#ddd;font:12px/1.3 system-ui,sans-serif}
  #grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px}
  .cell{background:#1d2029;border-radius:6px;padding:4px;position:relative}
  .cell h3{margin:2px 6px;font-size:14px;color:#fff}
  .cell pre{margin:0 6px;font-size:11px;color:#9ab}
  canvas{display:block;width:100%}
</style>
</head>
<body>
<div id="grid"></div>
<script type="module" src="./track-layout.js"></script>
</body>
</html>
