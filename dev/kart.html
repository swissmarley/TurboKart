<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TurboKart — Kart sandbox</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d12; font-family: system-ui, sans-serif; }
      canvas { display: block; width: 100%; height: 100%; }
      #hud { position: fixed; left: 10px; top: 8px; color: #fff; font: 600 12px/1.4 ui-monospace, Menlo, monospace;
             text-shadow: 0 1px 2px #000; pointer-events: none; white-space: pre; }
      #labels { position: fixed; inset: 0; pointer-events: none; }
      .lbl { position: absolute; transform: translate(-50%, 0); color: #fff; font: 800 15px/1.1 system-ui, sans-serif;
             text-align: center; text-shadow: 0 2px 4px rgba(0,0,0,.7); }
      .lbl small { display: block; font-weight: 600; font-size: 11px; opacity: .8; }
    </style>
  </head>
  <body>
    <div id="hud"></div>
    <div id="labels"></div>
    <script type="module" src="./kart-sandbox.js"></script>
  </body>
</html>
