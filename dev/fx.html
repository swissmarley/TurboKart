<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TurboKart FX sandbox</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #05060a; font-family: system-ui, sans-serif; }
      canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #hud { position: fixed; left: 8px; top: 8px; color: #fff; font: 12px/1.35 ui-monospace, monospace;
        background: rgba(0,0,0,0.45); padding: 6px 8px; border-radius: 6px; pointer-events: none; white-space: pre; }
      #hud.hidden { display: none; }
      #buttons { position: fixed; right: 8px; top: 8px; display: flex; flex-wrap: wrap; gap: 4px; max-width: 420px; justify-content: flex-end; }
      #buttons button { font: 12px system-ui; padding: 4px 8px; border-radius: 6px; border: 0; background: #2d3350; color: #fff; cursor: pointer; }
      #buttons button.on { background: #6a4cff; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="hud"></div>
    <div id="buttons"></div>
    <script type="module" src="./fx.js"></script>
  </body>
</html>
